<div class="container-xl top"><app-header></app-header></div>
<div class="container bottom">
  <div class="auth-form">
    <h1 class="auth-title">{{ 'auth.verify.title' | transloco }}</h1>
    <p class="auth-intro">
      {{ 'auth.verify.intro' | transloco: { email: email } }}
    </p>

    <div class="auth-notice" *ngIf="notice">{{ notice | transloco }}</div>
    <div class="auth-error text-danger" role="alert" *ngIf="error">
      {{ authErrorKey(error) | transloco }}
    </div>

    <form (submit)="$event.preventDefault(); submit()" novalidate>
      <div class="field">
        <label class="label" for="verify-code">{{
          'auth.verify.code' | transloco
        }}</label>
        <input
          id="verify-code"
          class="form-control"
          type="text"
          name="code"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          [(ngModel)]="code"
        />
      </div>

      <button
        class="button block submit"
        type="submit"
        [disabled]="!canSubmit || isSubmitting"
      >
        <ion-spinner *ngIf="isSubmitting" name="dots"></ion-spinner
        >{{ 'auth.verify.submit' | transloco }}
      </button>
    </form>

    <div class="auth-links">
      <button
        type="button"
        class="button outline block"
        [disabled]="cooldown.seconds > 0 || isResending"
        (click)="resend()"
      >
        <ng-container *ngIf="cooldown.seconds > 0">{{
          'auth.verify.resend_in' | transloco: { seconds: cooldown.seconds }
        }}</ng-container>
        <ng-container *ngIf="cooldown.seconds <= 0">{{
          'auth.verify.resend' | transloco
        }}</ng-container>
      </button>
    </div>

    <div class="text-center">
      <a routerLink="/sign-up" [queryParams]="{ email: email }">{{
        'auth.verify.change_email' | transloco
      }}</a>
    </div>
  </div>
</div>
