<div class="container-xl top"><app-header></app-header></div>
<div class="container bottom">
  <div class="auth-form">
    <h1 class="auth-title">{{ 'auth.forgot.title' | transloco }}</h1>
    <p class="auth-intro">{{ 'auth.forgot.intro' | transloco }}</p>

    <div class="auth-error text-danger" role="alert" *ngIf="error">
      {{ authErrorKey(error) | transloco }}
    </div>

    <form (submit)="$event.preventDefault(); submit()" novalidate>
      <div class="field">
        <label class="label" for="forgot-email">{{
          'auth.email' | transloco
        }}</label>
        <input
          id="forgot-email"
          class="form-control"
          type="email"
          name="email"
          autocomplete="username"
          inputmode="email"
          autocapitalize="off"
          spellcheck="false"
          [(ngModel)]="email"
        />
      </div>

      <button
        class="button block submit"
        type="submit"
        [disabled]="!canSubmit || isSubmitting"
      >
        <ion-spinner *ngIf="isSubmitting" name="dots"></ion-spinner
        >{{ 'auth.forgot.submit' | transloco }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/sign-in" [queryParams]="{ email: email || null }">{{
        'auth.forgot.back' | transloco
      }}</a>
    </div>
  </div>
</div>
