<div class="container-xl top"><app-header></app-header></div>
<div class="container bottom">
  <div class="auth-form">
    <h1 class="auth-title">{{ 'auth.reset.title' | transloco }}</h1>
    <p class="auth-intro">
      {{ 'auth.reset.intro' | transloco: { email: email } }}
    </p>

    <div class="auth-notice" *ngIf="notice">{{ notice | transloco }}</div>
    <div class="auth-error text-danger" role="alert" *ngIf="error">
      {{ authErrorKey(error) | transloco }}
    </div>

    <form (submit)="$event.preventDefault(); submit()" novalidate>
      <!-- Lets password managers store the new password under the account. -->
      <input
        type="email"
        name="username"
        autocomplete="username"
        [value]="email"
        hidden
      />

      <div class="field">
        <label class="label" for="reset-code">{{
          'auth.reset.code' | transloco
        }}</label>
        <input
          id="reset-code"
          class="form-control"
          type="text"
          name="code"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          [(ngModel)]="code"
        />
      </div>

      <div class="field">
        <label class="label" for="reset-password">{{
          'auth.reset.new_password' | transloco
        }}</label>
        <div class="password-field">
          <input
            id="reset-password"
            class="form-control"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            autocomplete="new-password"
            [(ngModel)]="password"
          />
          <button
            type="button"
            class="unstyled toggle"
            (click)="showPassword = !showPassword"
          >
            {{
              (showPassword ? 'auth.hide_password' : 'auth.show_password')
                | transloco
            }}
          </button>
        </div>
      </div>

      <app-password-requirements
        [password]="password"
      ></app-password-requirements>

      <button
        class="button block submit"
        type="submit"
        [disabled]="!canSubmit || isSubmitting"
      >
        <ion-spinner *ngIf="isSubmitting" name="dots"></ion-spinner
        >{{ 'auth.reset.submit' | transloco }}
      </button>
    </form>

    <div class="auth-links">
      <button
        type="button"
        class="button outline block"
        [disabled]="cooldown.seconds > 0 || isResending"
        (click)="resend()"
      >
        <ng-container *ngIf="cooldown.seconds > 0">{{
          'auth.verify.resend_in' | transloco: { seconds: cooldown.seconds }
        }}</ng-container>
        <ng-container *ngIf="cooldown.seconds <= 0">{{
          'auth.verify.resend' | transloco
        }}</ng-container>
      </button>
    </div>

    <div class="text-center">
      <a routerLink="/sign-in" [queryParams]="{ email: email }">{{
        'auth.forgot.back' | transloco
      }}</a>
    </div>
  </div>
</div>
