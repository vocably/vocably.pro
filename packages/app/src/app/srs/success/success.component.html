@if (studyStreak && studyStreak.days > 0) {
  <app-srs-streak
    [consecutiveDays]="studyStreak.days"
    [hasBeenShown]="streakAnimationShown"
  ></app-srs-streak>
} @else {
  <span class="big-icon"
    ><mat-icon
      aria-hidden="false"
      aria-label="Done"
      class="icon text-primary"
      inline="true"
      >check_circle</mat-icon
    ></span
  >
}
<figure class="quote appear">
  <mat-icon class="quote-icon" aria-hidden="true">format_quote</mat-icon>
  <blockquote class="quote-text">
    {{ 'srs.success.quote.' + quoteIndex | transloco }}
  </blockquote>
</figure>
<div class="actions appear">
  <a class="action primary" [routerLink]="['../']">
    <mat-icon aria-hidden="true">check</mat-icon>
    {{ 'srs.success.finish' | transloco }}
  </a>
  @if (hasCardsLeftForToday) {
    <button class="action secondary" (click)="oneMoreRound.emit()">
      <mat-icon aria-hidden="true">refresh</mat-icon>
      {{ 'srs.success.one_more' | transloco }}
    </button>
  }
</div>
