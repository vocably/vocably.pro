<div class="grade" *ngFor="let card of cards.slice(0, 1)">
  <div class="grade-container">
    <app-srs-grade
      [card]="card"
      [allCards]="cards"
      [studySteps]="studySteps"
      [prerenderedCards]="prerenderedCards"
      (grade)="onAnswer($event)"
    ></app-srs-grade>
  </div>
</div>
<app-srs-success
  *ngIf="cards.length === 0 && !saving"
  (oneMoreRound)="oneMoreRound.emit()"
  [studyStreak]="studyStreak"
  [hasCardsLeftForToday]="hasCardsLeftForToday"
  @displayComponent
></app-srs-success>
<div class="saving" *ngIf="cards.length === 0 && saving">
  <ion-spinner name="dots"></ion-spinner>
</div>
