<header class="header">
  <vocably-logo class="logo"></vocably-logo>
  <a class="settings" [routerLink]="['settings']"
    ><mat-icon>page_info</mat-icon>{{ 'home.settings' | translate }}</a
  >
</header>

<div *ngIf="!languagePairsLoaded" class="status">
  <ion-spinner name="dots"></ion-spinner>
  {{ 'home.loading_presets' | translate }}
</div>

<ng-container *ngIf="languagePairsLoaded">
  <div class="onboarding" *ngIf="needsOnboarding && isLoggedIn === true">
    <p class="onboarding-title">{{ 'home.almost_ready' | translate }}</p>
    <a [href]="welcomeUrl" target="_blank" class="button block">{{
      'home.setup' | translate
    }}</a>
  </div>

  <vocably-language
    *ngIf="needsOnboarding && isLoggedIn === false"
    class="block"
    sourceLanguage="en"
    [targetLanguage]="defaultTargetLanguage"
    [waiting]="isSavingLanguages"
    (confirm)="onLanguagesConfirm($event)"
  ></vocably-language>

  <ng-container *ngIf="!needsOnboarding">
    <vocably-search-form
      class="block"
      (valuesChange)="onSearchValuesChanged($any($event).detail)"
      (formSubmit)="onSearchFormSubmit($any($event).detail)"
      [values]="searchValues"
      [loading]="isSearching"
      [hideHint]="isSearching || !!searchResult"
      [autoFocus]="true"
      [languagePairs]="languagePairs"
    ></vocably-search-form>
    <vocably-skeleton-loader
      *ngIf="isSearching && !searchResult"
      class="skeleton"
    ></vocably-skeleton-loader>
    <div *ngIf="isSearching && searchResult" class="floating-loading">
      <ion-spinner name="dots"></ion-spinner>
      {{ 'home.requesting_chatgpt' | translate }}
    </div>

    <vocably-translation
      *ngIf="searchResult"
      class="search-result"
      [explanation]="explanationState"
      [explanationAnimationDelay]="explanationAnimationDelay"
      [askForRating]="this.askForRating"
      [extensionPlatform]="extensionPlatform"
      (ratingInteraction)="saveAskForRating($event)"
      [result]="searchResult"
      [showSaveHint]="false"
      [showLanguages]="false"
      [hideChatGpt]="true"
      [loading]="isTranslationLoading"
      [isRetrying]="isRetrying"
      (addCard)="addCard($event)"
      (removeCard)="removeCard($event)"
      (retry)="onRetry()"
      [updateCard]="updateCard"
      [attachTag]="attachTag"
      [detachTag]="detachTag"
      [deleteTag]="deleteTag"
      [updateTag]="updateTag"
      [playAudioPronunciation]="playAudioPronunciation"
      [cardsLimit]="cardsLimit"
      [paymentLink]="paymentLink"
      [isLoadingExtraWords]="isLoadingExtraWords"
      [isLoggedInUser]="isLoggedIn === true"
      (confirm)="onSignIn()"
    ></vocably-translation>
  </ng-container>
</ng-container>
